<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d13" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px #58a6ff); }
      50% { opacity: 0.95; filter: drop-shadow(0 0 20px #bc8cff); }
    }
    @keyframes pulseLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .node-pulse { animation: pulseGlow 4s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8 6; animation: pulseLine 8s linear infinite; }
    .ring-rot { transform-origin: 730px 140px; animation: rotateRing 20s linear infinite; }
    .ring-rev { transform-origin: 730px 140px; animation: rotateRing 14s linear infinite reverse; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGlow)" stroke="#30363d" stroke-width="1.5"/>

  <!-- 3D Isometric Grid Floor -->
  <g opacity="0.25" transform="translate(80, 200) skewX(-45) scale(1, 0.5)">
    <pattern id="isoGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#58a6ff" stroke-width="0.8"/>
    </pattern>
    <rect width="420" height="160" fill="url(#isoGrid)"/>
  </g>

  <!-- Hero Typography Section -->
  <g transform="translate(50, 65)">
    <!-- Status Chip -->
    <rect x="0" y="0" width="210" height="26" rx="13" fill="#1f242c" stroke="#388bfd" stroke-width="1" opacity="0.9"/>
    <circle cx="14" cy="13" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">SYSTEM ARCHITECT • SDE</text>

    <!-- Name Heading -->
    <text x="0" y="68" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Injeti Udaya Harsha
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="98" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="500">
      Autonomous Agentic Pipelines • In-Memory OLAP • Backend Systems
    </text>

    <!-- Interactive Badges Row -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="105" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="16" fill="#79c0ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600">&gt; Python 3.11</text>

      <rect x="115" y="0" width="120" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="127" y="16" fill="#d2a8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600">&gt; DuckDB WASM</text>

      <rect x="245" y="0" width="115" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="257" y="16" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600">&gt; LangGraph</text>

      <rect x="370" y="0" width="100" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="382" y="16" fill="#ffa657" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600">&gt; FastAPI</text>
    </g>
  </g>

  <!-- 3D Isometric Gyroscope / Orbital Core (Right Side) -->
  <g transform="translate(730, 140)">
    <!-- Ambient Depth Blur Rings -->
    <ellipse cx="0" cy="0" rx="105" ry="42" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.35" transform="rotate(-25)" class="ring-rot"/>
    <ellipse cx="0" cy="0" rx="95" ry="38" fill="none" stroke="#bc8cff" stroke-width="1.2" opacity="0.4" transform="rotate(35)" class="ring-rev"/>
    <ellipse cx="0" cy="0" rx="80" ry="32" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.3" transform="rotate(80)" class="ring-rot"/>

    <!-- Stream connections -->
    <path d="M -150 -40 Q -80 -80 0 0" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.6" class="stream-line"/>
    <path d="M -180 50 Q -90 90 0 0" fill="none" stroke="#3fb950" stroke-width="1.2" opacity="0.6" class="stream-line"/>

    <!-- 3D Wireframe Polyhedron Core -->
    <polygon points="0,-42 42,-18 0,6 -42,-18" fill="#1f242c" stroke="#58a6ff" stroke-width="1.8" opacity="0.9" filter="url(#glow)"/>
    <polygon points="-42,-18 0,6 0,48 -42,24" fill="#161b22" stroke="#bc8cff" stroke-width="1.8" opacity="0.85"/>
    <polygon points="0,6 42,-18 42,24 0,48" fill="#0d1117" stroke="#3fb950" stroke-width="1.8" opacity="0.85"/>

    <!-- Central Glowing Power Nucleus -->
    <circle cx="0" cy="6" r="7" fill="#58a6ff" class="node-pulse" filter="url(#glow)"/>

    <!-- Orbital Floating Satellites -->
    <g transform="translate(-85, -55)">
      <rect x="-38" y="-12" width="76" height="24" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" fill="#7ee787" font-family="ui-monospace,monospace" font-size="10" font-weight="700">FactLens</text>
    </g>
    <g transform="translate(85, -45)">
      <rect x="-45" y="-12" width="90" height="24" rx="5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" fill="#79c0ff" font-family="ui-monospace,monospace" font-size="10" font-weight="700">DataProfiler</text>
    </g>
    <g transform="translate(5, 75)">
      <rect x="-44" y="-12" width="88" height="24" rx="5" fill="#0d1117" stroke="#bc8cff" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" fill="#d2a8ff" font-family="ui-monospace,monospace" font-size="10" font-weight="700">JobHelperOS</text>
    </g>
  </g>
</svg>
